<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funding Distribution</title>
  <!-- Load Chart.js from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: transparent;
      text-align: center;
    }
    h2 {
      color: #ffffff; /* Changed title to white */
      margin-bottom: 20px;
      font-size: 24px;
    }
    .chart-container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h2>Funding Distribution</h2>
  
  <div class="chart-container">
    <canvas id="fundingChart"></canvas>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', (event) => {
      const ctx = document.getElementById('fundingChart').getContext('2d');
      
      const fundingChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [
            'AirReps', 'Lucas G.', 'ISF', 'Boeing', 
            'Farmers Insurance', 'King and Bunny’s', 'Starbucks', 
            'Microsoft', 'AFEW', 'Les Schwab', 'Polymaker'
          ],
          datasets: [{
            data: [22.2, 11.1, 7.4, 7.4, 2.2, 3.7, 14.8, 8.9, 7.4, 7.4, 7.4],
            backgroundColor: [
              '#00cc00', '#3b82f6', '#16a34a', '#1f4e79', 
              '#1e40af', '#60a5fa', '#10b981', '#1e3a8a', 
              '#a5d8ff', '#009900', '#3b82f6'
            ],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                boxWidth: 14,
                padding: 12,
                color: '#ffffff', /* Changed legend labels text to white */
                font: {
                  size: 13
                }
              }
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  let value = context.parsed || 0;
                  return ` Share : ${value}%`;
                }
              }
            }
          },
          cutout: '55%'
        }
      });
    });
  </script>

</body>
</html>
