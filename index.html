<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funding Chart Embed</title>
  <!-- Tailwind CSS for modern styling and layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" id="chartjs-script"></script>
  <style>
    /* Ensure transparent background for Wix iframe embeds */
    html, body {
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    /* Custom scrollbar for legend items if overflow occurs */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="flex flex-col justify-center items-center p-3 sm:p-5 select-none">

  <!-- Loading Screen Overlay -->
  <div id="loading-overlay" class="absolute inset-0 flex flex-col justify-center items-center bg-transparent z-50 transition-opacity duration-300">
    <div class="w-10 h-10 border-4 border-emerald-400/30 border-t-emerald-400 rounded-full animate-spin"></div>
    <span class="mt-3 text-xs font-semibold text-white/80 tracking-wider">LOADING CHART...</span>
  </div>

  <!-- Failed to Load Overlay (Hidden by default) -->
  <div id="error-overlay" class="hidden absolute inset-0 flex flex-col justify-center items-center bg-black/40 backdrop-blur-sm z-50 p-4 text-center">
    <div class="w-12 h-12 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mb-3">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>
    <p class="text-white text-sm font-semibold">Failed to load chart data</p>
    <p class="text-white/60 text-xs mt-1 mb-4">Please check your network connection.</p>
    <button onclick="retryInit()" class="px-4 py-1.5 text-xs font-medium text-white bg-emerald-600 hover:bg-emerald-500 rounded-lg transition-colors shadow-lg">
      Retry
    </button>
  </div>

  <!-- Main Container -->
  <div id="main-container" class="w-full max-w-xl flex flex-col justify-center items-center gap-4 my-auto min-h-0">

    <!-- Control Toolbar (Doughnut vs Pie Toggle) — Centered -->
    <div class="flex items-center justify-center w-full px-1">
      <div class="inline-flex rounded-lg bg-white/10 p-1 backdrop-blur-md border border-white/15 shadow-sm">
        <button id="btn-doughnut" onclick="switchChartType('doughnut')" class="px-3 py-1 text-xs font-medium text-white bg-emerald-500/90 rounded-md shadow transition-all duration-200">
          Doughnut
        </button>
        <button id="btn-pie" onclick="switchChartType('pie')" class="px-3 py-1 text-xs font-medium text-white/70 hover:text-white rounded-md transition-all duration-200">
          Pie
        </button>
      </div>
    </div>

    <!-- Chart Canvas Container -->
    <div class="relative w-full aspect-square max-h-[340px] sm:max-h-[380px] flex items-center justify-center">
      <canvas id="fundingChart" class="w-full h-full"></canvas>

      <!-- Center Text Stats Overlay for Doughnut view -->
      <div id="center-stats" class="absolute inset-0 flex flex-col justify-center items-center pointer-events-none transition-opacity duration-200">
        <span id="center-label" class="text-xs font-medium text-white/70 uppercase tracking-wider">Total Share</span>
        <span id="center-value" class="text-2xl sm:text-3xl font-bold text-white tracking-tight drop-shadow-md">100%</span>
        <span id="center-subtext" class="text-[10px] text-emerald-400 font-semibold tracking-wide">11 Contributors</span>
      </div>
    </div>

    <!-- Interactive Custom Legend Grid -->
    <div id="custom-legend" class="w-full max-h-[140px] overflow-y-auto custom-scrollbar flex flex-wrap justify-center gap-1.5 pt-2">
      <!-- Legend badges rendered dynamically via JavaScript -->
    </div>

  </div>

  <script>
    // Configuration Data
    const chartData = {
      labels: [
        'AirReps', 'Lucas G.', 'Issaquah Schools Foundation', 'Boeing', 
        'Farmers Insurance', 'King and Bunny\'s', 'Starbucks', 
        'Microsoft', 'AFEW', 'Les Schwab', 'Polymaker'
      ],
      datasets: [{
        data: [22.2, 11.1, 7.4, 7.4, 2.2, 3.7, 14.8, 8.9, 7.4, 7.4, 7.4],
        backgroundColor: [
          '#00cc00', '#3b82f6', '#16a34a', '#1f4e79', 
          '#1e40af', '#60a5fa', '#10b981', '#1e3a8a', 
          '#a5d8ff', '#009900', '#3b82f6'
        ],
        borderWidth: 2,
        borderColor: 'rgba(255, 255, 255, 0.8)',
        hoverBorderColor: '#ffffff',
        hoverBorderWidth: 3,
        hoverOffset: 8
      }]
    };

    let fundingChart = null;
    let currentType = 'doughnut';
    let resizeObserver = null;

    // Center stats element refs
    const centerStats = document.getElementById('center-stats');
    const centerLabel = document.getElementById('center-label');
    const centerValue = document.getElementById('center-value');
    const centerSubtext = document.getElementById('center-subtext');

    // Initialize Chart
    function initChart() {
      const loadingOverlay = document.getElementById('loading-overlay');
      const errorOverlay = document.getElementById('error-overlay');
      const canvas = document.getElementById('fundingChart');

      if (typeof Chart === 'undefined') {
        errorOverlay.classList.remove('hidden');
        loadingOverlay.classList.add('opacity-0');
        setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
        return;
      }

      try {
        const ctx = canvas.getContext('2d');

        fundingChart = new Chart(ctx, {
          type: currentType,
          data: chartData,
          options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: {
              padding: 12
            },
            plugins: {
              legend: {
                display: false // Using custom interactive legend badges
              },
              tooltip: {
                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                titleColor: '#ffffff',
                bodyColor: '#e2e8f0',
                borderColor: 'rgba(255, 255, 255, 0.2)',
                borderWidth: 1,
                padding: 10,
                cornerRadius: 8,
                displayColors: true,
                callbacks: {
                  label: function(context) {
                    const value = context.parsed || 0;
                    return ` Share: ${value}%`;
                  }
                }
              }
            },
            cutout: currentType === 'doughnut' ? '62%' : '0%',
            animation: {
              animateScale: true,
              animateRotate: true,
              duration: 800
            },
            onHover: (event, activeElements) => {
              if (activeElements && activeElements.length > 0) {
                const index = activeElements[0].index;
                const label = chartData.labels[index];
                const val = chartData.datasets[0].data[index];
                const color = chartData.datasets[0].backgroundColor[index];
                updateCenterStats(label, `${val}%`, 'Contributor Share', color);
              } else {
                resetCenterStats();
              }
            }
          }
        });

        renderLegend();
        setupResizeObserver();

        // Smooth hide loading screen
        loadingOverlay.classList.add('opacity-0');
        setTimeout(() => loadingOverlay.classList.add('hidden'), 300);

      } catch (err) {
        console.error('Chart Initialization Error:', err);
        errorOverlay.classList.remove('hidden');
        loadingOverlay.classList.add('opacity-0');
        setTimeout(() => loadingOverlay.classList.add('hidden'), 300);
      }
    }

    // Render Dynamic Interactive Badges Legend
    function renderLegend() {
      const legendContainer = document.getElementById('custom-legend');
      legendContainer.innerHTML = '';

      chartData.labels.forEach((label, index) => {
        const value = chartData.datasets[0].data[index];
        const color = chartData.datasets[0].backgroundColor[index];
        const isHidden = !fundingChart.getDataVisibility(index);

        const badge = document.createElement('button');
        badge.className = `flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium border transition-all duration-150 backdrop-blur-sm ${
          isHidden 
            ? 'opacity-40 border-white/10 bg-black/20 text-white/50 line-through' 
            : 'border-white/15 bg-white/10 text-white hover:bg-white/20 hover:scale-105'
        }`;

        badge.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full shadow-sm flex-shrink-0" style="background-color: ${color}"></span>
          <span>${label}</span>
          <span class="text-[10px] text-white/60 ml-0.5">${value}%</span>
        `;

        // Toggle slice visibility on click
        badge.onclick = () => {
          fundingChart.toggleDataVisibility(index);
          fundingChart.update();
          renderLegend();
        };

        // Highlight slice on legend hover
        badge.onmouseenter = () => {
          if (!isHidden) {
            fundingChart.setActiveElements([{ datasetIndex: 0, index: index }]);
            fundingChart.tooltip.setActiveElements([{ datasetIndex: 0, index: index }], { x: 0, y: 0 });
            fundingChart.update();
            updateCenterStats(label, `${value}%`, 'Contributor Share', color);
          }
        };

        badge.onmouseleave = () => {
          fundingChart.setActiveElements([]);
          fundingChart.tooltip.setActiveElements([], { x: 0, y: 0 });
          fundingChart.update();
          resetCenterStats();
        };

        legendContainer.appendChild(badge);
      });
    }

    // Toggle between Doughnut and Pie formats
    function switchChartType(type) {
      if (currentType === type || !fundingChart) return;
      currentType = type;

      const btnDoughnut = document.getElementById('btn-doughnut');
      const btnPie = document.getElementById('btn-pie');

      if (type === 'doughnut') {
        btnDoughnut.className = "px-3 py-1 text-xs font-medium text-white bg-emerald-500/90 rounded-md shadow transition-all duration-200";
        btnPie.className = "px-3 py-1 text-xs font-medium text-white/70 hover:text-white rounded-md transition-all duration-200";
        centerStats.style.opacity = '1';
        fundingChart.options.cutout = '62%';
      } else {
        btnPie.className = "px-3 py-1 text-xs font-medium text-white bg-emerald-500/90 rounded-md shadow transition-all duration-200";
        btnDoughnut.className = "px-3 py-1 text-xs font-medium text-white/70 hover:text-white rounded-md transition-all duration-200";
        centerStats.style.opacity = '0';
        fundingChart.options.cutout = '0%';
      }

      fundingChart.update();
    }

    // Helper functions for Center Text Overlay
    function updateCenterStats(label, value, subtext, color) {
      if (currentType !== 'doughnut') return;
      centerLabel.innerText = label;
      centerValue.innerText = value;
      centerSubtext.innerText = subtext;
      if (color) centerSubtext.style.color = color;
    }

    function resetCenterStats() {
      if (currentType !== 'doughnut') return;
      centerLabel.innerText = 'Total Share';
      centerValue.innerText = '100%';
      centerSubtext.innerText = '11 Contributors';
      centerSubtext.style.color = '#34d399'; // Emerald color
    }

    // Monitor parent container resizing for Wix Embed area scaling
    function setupResizeObserver() {
      const container = document.getElementById('main-container');
      if (!container) return;

      resizeObserver = new ResizeObserver(() => {
        if (fundingChart) {
          fundingChart.resize();
        }
      });
      resizeObserver.observe(container);
    }

    // Retry initialization if script failed
    function retryInit() {
      document.getElementById('error-overlay').classList.add('hidden');
      const loadingOverlay = document.getElementById('loading-overlay');
      loadingOverlay.classList.remove('hidden', 'opacity-0');
      
      // Reload chart script if missing
      if (typeof Chart === 'undefined') {
        const script = document.createElement('script');
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js";
        script.onload = () => initChart();
        script.onerror = () => {
          document.getElementById('error-overlay').classList.remove('hidden');
          loadingOverlay.classList.add('opacity-0');
        };
        document.head.appendChild(script);
      } else {
        initChart();
      }
    }

    // Run initialization on DOM load
    window.addEventListener('DOMContentLoaded', initChart);
  </script>
</body>
</html>
